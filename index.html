<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정이한 - 웹 포트폴리오</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 프로필 헤더 -->
    <header class="profile-header">
        <div class="profile-container">
            <h1 class="name">정이한</h1>
            <div class="profile-info">
                <span class="school">성서초등학교 6학년</span>
                <span class="role">개발자</span>
            </div>
            <p class="bio">AI파이썬랩 심화 · <a href="https://github.com/Jeffrey-void" target="_blank">GitHub</a></p>
            <div class="tech-badges">
                <span class="badge">Python</span>
                <span class="badge">Streamlit</span>
                <span class="badge">OpenAI API</span>
                <span class="badge">공공데이터 API</span>
            </div>
        </div>
    </header>

    <!-- 프로젝트 카드 목록 -->
    <main class="projects-section">
        <h2>프로젝트</h2>
        <div class="projects-grid" id="projectsGrid">
            <!-- projects.js에서 동적으로 생성됨 -->
        </div>
    </main>

    <!-- 프로젝트 상세 모달 -->
    <div class="modal" id="projectModal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <div class="modal-body" id="modalBody">
                <!-- 프로젝트 상세 내용이 여기 들어감 -->
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="footer-content">
            <p>AI파이썬랩 | 정이한</p>
            <div class="footer-links">
                <a href="https://github.com/Jeffrey-void" target="_blank">GitHub</a>
            </div>
        </div>
    </footer>

    <script src="projects.js"></script>
    <script src="script.js"></script>
</body>
</html>
